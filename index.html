<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fsm-poetry</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <style></style>
  </head>
  <body>
    <h1>FINITE STATE MACHINE POETRY</h1>

    <div class="layout">
      <div class="canvas-panel" id="canvasPanel">
        <div class="svg-host" id="svgHost">
          <div class="empty-hint" id="emptyHint">your fsm will appear here</div>
        </div>
        <div class="zoom-controls" id="zoomControls" style="display: none">
          <button type="button" id="zoomInBtn" title="Zoom in">+</button>
          <button type="button" id="zoomOutBtn" title="Zoom out">
            &minus;
          </button>
        </div>
      </div>

      <div class="sidebar">
        <div class="textarea-wrapper">
          <div class="text-editor" id="textEditor" contenteditable="true"></div>
          <div class="text-editor-placeholder">write something...</div>
          <div class="word-count" id="wordCount">0 / 2000 words</div>
        </div>
        <button id="createBtn">Create FSM</button>
        <div class="status" id="status">awaiting generation</div>

        <div class="controls">
          <h2>Colors</h2>
          <div class="theme-buttons">
            <label class="color-picker">
              <span>ink</span>
              <input type="color" id="darkColorPicker" value="#6b6b6b" />
            </label>
            <label class="color-picker fill-picker">
              <span>fill</span>
              <input type="color" id="bgColorPicker" value="#eeeeee" />
            </label>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
